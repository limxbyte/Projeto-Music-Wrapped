<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Wrapped</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="welcome" id="welcome">
        <div class="content">
            <p class="year">2026</p>
            <h1>Music<br>Wrapped</h1>
            <p class="description">
                Descubra as músicas, artistas e gêneros
                que fizeram parte do seu ano.
            </p>
            <button id="startButton">
                Começar
            </button>
        </div>
    </main>
    <section class="wrapped" id="wrapped">
        <div class="content">
            <p class="year">SEU ANO EM MÚSICAS</p>
            <img src="assets/artista.jpg" alt="artista" class="artist-image">
            <h2>Seu artista<br>mais ouvido foi</h2>
            <h3 id="artistName"></h3>
            <p class="plays" id="artistPlays"></p>
        </div>
    </section>
    <script src="app.js"></script>
</body>
</html>
